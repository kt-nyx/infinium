[package]
name = "loot-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# libloot core is written in Rust; this pulls it as a dependency. Wiring the
# full API is left as a follow-up, but this establishes the linkage.
libloot = { git = "https://github.com/loot/libloot.git" }


