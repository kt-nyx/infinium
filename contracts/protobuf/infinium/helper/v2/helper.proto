syntax = "proto3";

package infinium.helper.v2;

option csharp_namespace = "Infinium.Contracts.Protobuf.Helper.V2";

import "infinium/common/v1/common.proto";
import "infinium/domain/v1/identities.proto";

enum HelperAssignmentKindV2 {
  HELPER_ASSIGNMENT_KIND_V2_UNSPECIFIED = 0;
  HELPER_ASSIGNMENT_KIND_V2_ENROLL = 1;
  HELPER_ASSIGNMENT_KIND_V2_REPLACE = 2;
  HELPER_ASSIGNMENT_KIND_V2_VERIFY = 3;
  HELPER_ASSIGNMENT_KIND_V2_DISABLE = 4;
  HELPER_ASSIGNMENT_KIND_V2_DELETE = 5;
  HELPER_ASSIGNMENT_KIND_V2_RECOVER = 6;
  HELPER_ASSIGNMENT_KIND_V2_PROVIDER_DISPATCH = 7;
}

enum ProviderEndpointV2 {
  PROVIDER_ENDPOINT_V2_UNSPECIFIED = 0;
  PROVIDER_ENDPOINT_V2_OPENAI_RESPONSES = 1;
}

enum ProviderOperationKindV2 {
  PROVIDER_OPERATION_KIND_V2_UNSPECIFIED = 0;
  PROVIDER_OPERATION_KIND_V2_TRANSPORT_QUALIFICATION = 1;
  PROVIDER_OPERATION_KIND_V2_SOURCE_CLAIM_EXTRACTION = 2;
  PROVIDER_OPERATION_KIND_V2_CANDIDATE_INVESTIGATION = 3;
}

enum DispatchDispositionV2 {
  DISPATCH_DISPOSITION_V2_UNSPECIFIED = 0;
  DISPATCH_DISPOSITION_V2_AUTHORIZED = 1;
  DISPATCH_DISPOSITION_V2_REJECTED = 2;
  DISPATCH_DISPOSITION_V2_STALE_GENERATION = 3;
  DISPATCH_DISPOSITION_V2_REVOKED = 4;
  DISPATCH_DISPOSITION_V2_BUDGET_UNAVAILABLE = 5;
  DISPATCH_DISPOSITION_V2_DEADLINE_EXPIRED = 6;
  DISPATCH_DISPOSITION_V2_COORDINATOR_UNAVAILABLE = 7;
}

enum HelperOutcomeV2 {
  HELPER_OUTCOME_V2_UNSPECIFIED = 0;
  HELPER_OUTCOME_V2_COMPLETED = 1;
  HELPER_OUTCOME_V2_FAILED_KNOWN = 2;
  HELPER_OUTCOME_V2_TRANSPORT_MAY_HAVE_STARTED = 3;
  HELPER_OUTCOME_V2_UNAVAILABLE = 4;
  HELPER_OUTCOME_V2_CANCELLED = 5;
  HELPER_OUTCOME_V2_OVERSIZED = 6;
  HELPER_OUTCOME_V2_MALFORMED = 7;
}

enum InputBoundProofStatusV2 {
  INPUT_BOUND_PROOF_STATUS_V2_UNSPECIFIED = 0;
  INPUT_BOUND_PROOF_STATUS_V2_AUTHORITY_REQUIRED = 1;
  INPUT_BOUND_PROOF_STATUS_V2_PROVED = 2;
}

// Private-handle-only Slice 6 protocol. Decoders reject unknown fields at
// every privileged boundary. v1 remains a separately generated/decodable
// contract and is never reinterpreted as this identity.
message HelperPrivateFrameV2 {
  uint64 sequence = 1;
  bytes protocol_fingerprint_sha256 = 2;
  oneof payload {
    HelperBootstrapV2 bootstrap = 10;
    HelperAssignmentV2 assignment = 11;
    DispatchRevalidationV2 dispatch_revalidation = 12;
    HelperReceiptV2 receipt = 13;
  }
  reserved 90 to 99;
  reserved "credential_target", "provider_secret", "authorization_header",
      "database_path", "arbitrary_url";
}

message HelperBootstrapV2 {
  reserved 1, 2;
  reserved "operation_id", "attempt_id";
  uint64 coordinator_fencing_epoch = 3;
  infinium.common.v1.Instant expires_at = 4;
  bytes one_use_nonce_fingerprint_sha256 = 5;
  string command_id = 6;
  oneof subject {
    CredentialSubjectV2 credential = 10;
    ProviderDispatchSubjectV2 provider_dispatch = 11;
  }
}

message CredentialSubjectV2 {
  infinium.domain.v1.ProviderAccessProfileId access_profile_id = 1;
  infinium.domain.v1.CredentialGenerationId generation_id = 2;
}

message ProviderDispatchSubjectV2 {
  infinium.domain.v1.OperationId operation_id = 1;
  infinium.domain.v1.AttemptId attempt_id = 2;
}

message HelperAssignmentV2 {
  reserved 1, 2;
  reserved "operation_id", "attempt_id";
  infinium.domain.v1.ProviderAccessProfileId access_profile_id = 3;
  infinium.domain.v1.CredentialGenerationId generation_id = 4;
  uint64 generation_ordinal = 5;
  uint64 revocation_epoch = 6;
  HelperAssignmentKindV2 assignment_kind = 7;
  ProviderRequestV2 provider_request = 8;
  HelperLimitsV2 limits = 9;
  ProviderOperationKindV2 operation_kind = 10;
  string assignment_id = 11;
  string command_id = 12;
  oneof subject {
    CredentialSubjectV2 credential = 13;
    ProviderDispatchSubjectV2 provider_dispatch = 14;
  }
  reserved 90 to 99;
  reserved "credential_target", "provider_secret", "secret_bytes",
      "host", "url", "fallback_profile_id";
}

message ProviderRequestV2 {
  infinium.domain.v1.DispatchId dispatch_id = 1;
  bytes canonical_request_bytes = 2;
  infinium.common.v1.ContentDigest canonical_request = 3;
  infinium.domain.v1.CapabilitySnapshotId capability_snapshot_id = 4;
  infinium.domain.v1.PriceSnapshotId price_snapshot_id = 5;
  infinium.domain.v1.ReservationGroupId reservation_group_id = 6;
  infinium.common.v1.Instant dispatch_deadline = 7;
  ProviderEndpointV2 endpoint_identity = 8;
  InputBoundProofV2 input_bound_proof = 9;
  string request_id = 10;
  infinium.common.v1.Instant confirmed_at = 11;
  bytes request_fingerprint_sha256 = 12;
}

message InputBoundProofV2 {
  string policy_id = 1;
  string policy_version = 2;
  InputBoundProofStatusV2 status = 3;
  reserved 4, 5;
  reserved "canonical_request_bytes", "proved_input_token_bound";
}

message HelperLimitsV2 {
  uint64 maximum_frame_bytes = 1;
  uint64 maximum_request_bytes = 2;
  uint64 maximum_response_bytes = 3;
  uint64 maximum_staged_output_bytes = 4;
  uint64 maximum_input_tokens = 5;
  uint64 maximum_output_tokens = 6;
  int64 maximum_calculated_nano_usd = 7;
  infinium.common.v1.DurationMillis maximum_duration = 8;
  uint64 maximum_dispatch_count = 9;
}

message DispatchRevalidationV2 {
  infinium.domain.v1.DispatchId dispatch_id = 1;
  infinium.domain.v1.AttemptId attempt_id = 2;
  uint64 coordinator_fencing_epoch = 3;
  infinium.domain.v1.ProviderAccessProfileId access_profile_id = 4;
  infinium.domain.v1.CredentialGenerationId generation_id = 5;
  uint64 revocation_epoch = 6;
  infinium.domain.v1.ReservationGroupId reservation_group_id = 7;
  infinium.common.v1.ContentDigest canonical_request = 8;
  bool authorized_once = 9;
  DispatchDispositionV2 disposition = 10;
  infinium.domain.v1.ProviderAccountIdentityId account_identity_id = 11;
  infinium.domain.v1.BillingScopeIdentityId billing_scope_identity_id = 12;
  string effective_configuration_id = 13;
  infinium.domain.v1.CapabilitySnapshotId capability_snapshot_id = 14;
  infinium.domain.v1.PriceSnapshotId price_snapshot_id = 15;
  infinium.common.v1.ContentDigest settings = 16;
  infinium.common.v1.ContentDigest output_schema = 17;
  ProviderOperationKindV2 operation_kind = 18;
  InputBoundProofV2 input_bound_proof = 19;
  infinium.common.v1.Instant dispatch_deadline = 20;
  HelperLimitsV2 limits = 21;
  infinium.common.v1.Instant evaluated_at = 22;
  string request_id = 23;
}

message HelperReceiptV2 {
  reserved 1, 2;
  reserved "operation_id", "attempt_id";
  HelperOutcomeV2 outcome = 3;
  bool transport_may_have_started = 4;
  infinium.common.v1.OptionalUInt64 input_tokens = 5;
  infinium.common.v1.OptionalUInt64 output_tokens = 6;
  infinium.common.v1.OptionalUInt64 reasoning_tokens = 7;
  infinium.common.v1.OptionalUInt64 cache_read_tokens = 8;
  infinium.common.v1.OptionalUInt64 cache_write_tokens = 9;
  infinium.common.v1.ContentDigest raw_response = 10;
  infinium.common.v1.ContentDigest non_secret_receipt = 11;
  HelperAssignmentKindV2 assignment_kind = 12;
  string assignment_id = 13;
  string request_id = 14;
  infinium.domain.v1.DispatchId dispatch_id = 15;
  InputBoundProofV2 input_bound_proof = 16;
  bool outcome_has_response = 17;
  string command_id = 18;
  oneof subject {
    CredentialSubjectV2 credential = 19;
    ProviderDispatchSubjectV2 provider_dispatch = 20;
  }
  bytes request_fingerprint_sha256 = 21;
  uint64 coordinator_fencing_epoch = 22;
  infinium.domain.v1.CapabilitySnapshotId capability_snapshot_id = 23;
  infinium.domain.v1.PriceSnapshotId price_snapshot_id = 24;
  infinium.common.v1.ContentDigest settings = 25;
  infinium.common.v1.ContentDigest output_schema = 26;
  string effective_configuration_id = 27;
  reserved 90 to 99;
  reserved "credential_target", "provider_secret", "secret_bytes",
      "authorization_header";
}
