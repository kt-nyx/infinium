syntax = "proto3";

package infinium.domain.v1;

option csharp_namespace = "Infinium.Contracts.Protobuf.Domain.V1";

import "infinium/common/v1/common.proto";
import "infinium/domain/v1/identities.proto";

message AnalysisArtifactId { string value = 1; }
message DocumentationRevisionId { string value = 1; }
message PassageId { string value = 1; }
message CandidateDecisionId { string value = 1; }
message ReconciliationAssessmentId { string value = 1; }
message LineageEventId { string value = 1; }
message ReplayManifestId { string value = 1; }

enum AnalysisArtifactKind {
  ANALYSIS_ARTIFACT_KIND_UNSPECIFIED = 0;
  ANALYSIS_ARTIFACT_KIND_DOCUMENTATION_EVIDENCE = 1;
  ANALYSIS_ARTIFACT_KIND_CANDIDATE_ANALYSIS = 2;
  ANALYSIS_ARTIFACT_KIND_FINDING_CASE = 3;
  ANALYSIS_ARTIFACT_KIND_ANALYSIS_REPLAY = 4;
  ANALYSIS_ARTIFACT_KIND_ANALYSIS_EXECUTION_INPUT = 5;
  ANALYSIS_ARTIFACT_KIND_UNKNOWN = 6;
  ANALYSIS_ARTIFACT_KIND_UNSUPPORTED = 7;
}

enum AnalysisArtifactState {
  ANALYSIS_ARTIFACT_STATE_UNSPECIFIED = 0;
  ANALYSIS_ARTIFACT_STATE_PRESENT = 1;
  ANALYSIS_ARTIFACT_STATE_RESOLVED_NEGATIVE = 2;
  ANALYSIS_ARTIFACT_STATE_MISSING = 3;
  ANALYSIS_ARTIFACT_STATE_INVALID_INPUT = 4;
  ANALYSIS_ARTIFACT_STATE_UNSUPPORTED = 5;
  ANALYSIS_ARTIFACT_STATE_AMBIGUOUS = 6;
  ANALYSIS_ARTIFACT_STATE_PARTIAL = 7;
  ANALYSIS_ARTIFACT_STATE_ABSTAINED = 8;
  ANALYSIS_ARTIFACT_STATE_NOT_APPLICABLE = 9;
  ANALYSIS_ARTIFACT_STATE_NOT_USED = 10;
  ANALYSIS_ARTIFACT_STATE_FAILED = 11;
  ANALYSIS_ARTIFACT_STATE_CANCELLED = 12;
  ANALYSIS_ARTIFACT_STATE_LIMIT_REACHED = 13;
  ANALYSIS_ARTIFACT_STATE_UNAVAILABLE = 14;
  ANALYSIS_ARTIFACT_STATE_UNKNOWN = 20;
}

enum CandidateLane {
  CANDIDATE_LANE_UNSPECIFIED = 0;
  CANDIDATE_LANE_DETERMINISTIC_REQUIRED = 1;
  CANDIDATE_LANE_MANDATORY_EVIDENCE = 2;
  CANDIDATE_LANE_OPTIONAL_RANKED = 3;
  CANDIDATE_LANE_UNKNOWN = 4;
  CANDIDATE_LANE_UNSUPPORTED = 5;
  reserved 6;
}

enum CandidateDecisionDisposition {
  CANDIDATE_DECISION_DISPOSITION_UNSPECIFIED = 0;
  CANDIDATE_DECISION_DISPOSITION_CANDIDATE_ADMITTED = 1;
  CANDIDATE_DECISION_DISPOSITION_RESOLVED_NEGATIVE = 2;
  CANDIDATE_DECISION_DISPOSITION_UNSUPPORTED = 3;
  CANDIDATE_DECISION_DISPOSITION_AMBIGUOUS = 4;
  CANDIDATE_DECISION_DISPOSITION_INVALID_INPUT = 5;
  CANDIDATE_DECISION_DISPOSITION_LIMITED = 6;
  CANDIDATE_DECISION_DISPOSITION_ABSTAINED = 7;
  CANDIDATE_DECISION_DISPOSITION_UNKNOWN = 8;
  CANDIDATE_DECISION_DISPOSITION_DEFERRED = 9;
  CANDIDATE_DECISION_DISPOSITION_UNPROCESSED = 10;
  CANDIDATE_DECISION_DISPOSITION_FAILED = 11;
}

enum AnalysisConfidence {
  ANALYSIS_CONFIDENCE_UNSPECIFIED = 0;
  ANALYSIS_CONFIDENCE_SPECULATIVE_LEAD = 1;
  ANALYSIS_CONFIDENCE_PLAUSIBLE = 2;
  ANALYSIS_CONFIDENCE_STRONGLY_SUPPORTED = 3;
  ANALYSIS_CONFIDENCE_CONFIRMED = 4;
  ANALYSIS_CONFIDENCE_UNKNOWN = 5;
  ANALYSIS_CONFIDENCE_UNSUPPORTED = 6;
}

enum FindingSeverity {
  FINDING_SEVERITY_UNSPECIFIED = 0;
  FINDING_SEVERITY_ADVISORY = 1;
  FINDING_SEVERITY_MINOR = 2;
  FINDING_SEVERITY_MODERATE = 3;
  FINDING_SEVERITY_MAJOR = 4;
  FINDING_SEVERITY_BLOCKER = 5;
  FINDING_SEVERITY_UNKNOWN = 6;
  FINDING_SEVERITY_UNSUPPORTED = 7;
}

enum CaseKind {
  CASE_KIND_UNSPECIFIED = 0;
  CASE_KIND_SUPPORTED = 1;
  CASE_KIND_LEAD_ONLY = 2;
  CASE_KIND_UNKNOWN = 3;
  CASE_KIND_UNSUPPORTED = 4;
}

enum ReconciliationOutcome {
  RECONCILIATION_OUTCOME_UNSPECIFIED = 0;
  RECONCILIATION_OUTCOME_EXACT_CONTINUATION = 1;
  RECONCILIATION_OUTCOME_ANALYTICAL_REVISION = 2;
  RECONCILIATION_OUTCOME_RELATED_FOLLOW_UP = 3;
  RECONCILIATION_OUTCOME_NEW_DISTINCT = 4;
  RECONCILIATION_OUTCOME_AMBIGUOUS = 5;
  RECONCILIATION_OUTCOME_UNKNOWN = 6;
  RECONCILIATION_OUTCOME_NOT_OBSERVED = 7;
  RECONCILIATION_OUTCOME_NOT_EVALUATED = 8;
  RECONCILIATION_OUTCOME_UNSUPPORTED = 9;
}

enum ReplayState {
  REPLAY_STATE_UNSPECIFIED = 0;
  REPLAY_STATE_COMPLETE_CLEAN = 1;
  REPLAY_STATE_PARTIAL = 2;
  REPLAY_STATE_AUDIT_ONLY = 3;
  REPLAY_STATE_UNAVAILABLE = 4;
  REPLAY_STATE_FAILED_IDENTITY_DRIFT = 5;
  REPLAY_STATE_UNKNOWN = 6;
  REPLAY_STATE_UNSUPPORTED = 7;
}

message AnalysisArtifactReference {
  AnalysisArtifactId artifact_id = 1;
  AnalysisArtifactKind kind = 2;
  string schema_id = 3;
  infinium.common.v1.SemanticVersion schema_version = 4;
  uint64 revision = 5;
  AnalysisArtifactState state = 6;
  infinium.common.v1.ContentDigest content_digest = 7;
  uint64 byte_length = 8;
  AnalysisArtifactId provenance_id = 9;
  AnalysisArtifactId dependency_closure_id = 10;
}

message CandidateDecisionSummary {
  CandidateDecisionId decision_id = 1;
  AnalysisArtifactId population_member_id = 2;
  CandidateLane lane = 3;
  CandidateDecisionDisposition disposition = 4;
  bool admission_independent_of_score = 5;
  string inert_reason = 6;
  AnalysisArtifactId source_fact_id = 7;
}

message FindingCaseSummary {
  FindingOccurrenceId finding_occurrence_id = 1;
  LogicalFindingId logical_finding_id = 2;
  CaseOccurrenceId case_occurrence_id = 3;
  LogicalCaseId logical_case_id = 4;
  FindingSeverity severity = 5;
  AnalysisConfidence confidence = 6;
  CaseKind case_kind = 7;
  string inert_summary = 8;
}

message ReconciliationSummary {
  ReconciliationAssessmentId assessment_id = 1;
  AnalysisArtifactId prior_occurrence_id = 2;
  AnalysisArtifactId current_occurrence_id = 3;
  ReconciliationOutcome outcome = 4;
  repeated string inert_gaps = 5;
}

message ReplaySummary {
  ReplayManifestId replay_manifest_id = 1;
  ReplayState replay_state = 2;
  AuditabilityState auditability_state = 3;
  bool semantically_equivalent = 4;
  uint64 dependency_count = 5;
  uint64 missing_dependency_count = 6;
  uint64 coverage_gap_count = 7;
}
