syntax = "proto3";

package infinium.application.v1;

option csharp_namespace = "Infinium.Contracts.Protobuf.Application.V1";

import "infinium/common/v1/common.proto";
import "infinium/domain/v1/identities.proto";
import "infinium/domain/v1/analysis.proto";
import "infinium/protocol/v1/protocol.proto";

service ApplicationService {
  rpc Negotiate(infinium.protocol.v1.ApplicationHandshakeRequest)
      returns (infinium.protocol.v1.HandshakeResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc GetApplicationBootstrap(GetApplicationBootstrapRequest)
      returns (GetApplicationBootstrapResponse);
  rpc GetSetupState(GetSetupStateRequest) returns (GetSetupStateResponse);
  rpc SubmitSetupCommand(SubmitSetupCommandRequest)
      returns (SubmitSetupCommandResponse);
  rpc PrepareManualRun(PrepareManualRunRequest)
      returns (PrepareManualRunResponse);
  rpc SubmitPreparedRun(SubmitPreparedRunRequest)
      returns (SubmitRunCommandResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse);
  rpc GetProgress(GetProgressRequest) returns (GetProgressResponse);
  rpc SubmitRunCommand(SubmitRunCommandRequest)
      returns (SubmitRunCommandResponse);
  rpc GetDurableCommand(GetDurableCommandRequest)
      returns (GetDurableCommandResponse);
  rpc SubscribeEvents(SubscribeEventsRequest)
      returns (stream ApplicationEvent);
  rpc SubmitSnapshotCapture(SubmitSnapshotCaptureRequest)
      returns (SubmitSnapshotCaptureResponse);
  rpc GetSnapshotCapture(GetSnapshotCaptureRequest)
      returns (GetSnapshotCaptureResponse);
  rpc GetAnalysisSummary(GetAnalysisSummaryRequest)
      returns (GetAnalysisSummaryResponse);
  rpc ListAnalysisArtifacts(ListAnalysisArtifactsRequest)
      returns (ListAnalysisArtifactsResponse);
  rpc GetAnalysisProvenance(GetAnalysisProvenanceRequest)
      returns (GetAnalysisProvenanceResponse);
  rpc GetAnalysisReplay(GetAnalysisReplayRequest)
      returns (GetAnalysisReplayResponse);
  rpc GetAnalysisOutput(GetAnalysisOutputRequest)
      returns (GetAnalysisOutputResponse);
  rpc GetProviderProfile(GetProviderProfileRequest)
      returns (GetProviderProfileResponse);
  rpc GetProviderOperation(GetProviderOperationRequest)
      returns (GetProviderOperationResponse);
  rpc ListProviderBudget(ListProviderBudgetRequest)
      returns (ListProviderBudgetResponse);
  rpc GetProviderReplay(GetProviderReplayRequest)
      returns (GetProviderReplayResponse);
  rpc SubmitProviderEnrollment(SubmitProviderEnrollmentRequest)
      returns (SubmitProviderCommandResponse);
  rpc SubmitProviderOperation(SubmitProviderOperationRequest)
      returns (SubmitProviderCommandResponse);
}

// The desktop host requests this bounded projection before exposing any
// renderer operation. It contains display-safe state only and grants no
// filesystem, command, provider, credential, or coordinator authority.
message GetApplicationBootstrapRequest {
  infinium.common.v1.SemanticVersion renderer_contract_version = 1;
  uint32 maximum_recent_runs = 2;
  infinium.domain.v1.ProjectionVersion expected_projection_version = 3;

  reserved 90 to 99;
  reserved "path", "sql", "command", "url", "credential", "provider_request";
}

message GetApplicationBootstrapResponse {
  oneof result {
    ApplicationBootstrap bootstrap = 1;
    ApplicationContractError error = 2;
  }
}

message ApplicationBootstrap {
  infinium.protocol.v1.ContractCompatibility compatibility = 1;
  infinium.common.v1.ProtocolLimits limits = 2;
  infinium.common.v1.SemanticVersion renderer_contract_version = 3;
  HealthState coordinator_health = 4;
  repeated ApplicationCapabilityState capabilities = 5;
  ConfigurationAvailability configuration = 6;
  repeated RunSummary recent_runs = 7;
  infinium.domain.v1.ProjectionVersion projection_version = 8;
  infinium.domain.v1.CoordinatorInstanceId coordinator_instance_id = 9;
  uint64 coordinator_fencing_epoch = 10;
  infinium.common.v1.Instant observed_at = 11;
}

message ApplicationCapabilityState {
  ApplicationCapability capability = 1;
  Availability availability = 2;
  string inert_reason = 3;
}

enum ApplicationCapability {
  APPLICATION_CAPABILITY_UNSPECIFIED = 0;
  APPLICATION_CAPABILITY_BOOTSTRAP = 1;
  APPLICATION_CAPABILITY_RUN_QUERY = 2;
  APPLICATION_CAPABILITY_EVENT_RESYNC = 3;
  APPLICATION_CAPABILITY_CONFIGURATION = 4;
  APPLICATION_CAPABILITY_PROVIDER_ENROLLMENT = 5;
  APPLICATION_CAPABILITY_UNKNOWN = 6;
  APPLICATION_CAPABILITY_UNSUPPORTED = 7;
}

enum Availability {
  AVAILABILITY_UNSPECIFIED = 0;
  AVAILABILITY_AVAILABLE = 1;
  AVAILABILITY_PARTIAL = 2;
  AVAILABILITY_UNAVAILABLE = 3;
  AVAILABILITY_UNKNOWN = 4;
  AVAILABILITY_UNSUPPORTED = 5;
}

message ConfigurationAvailability {
  Availability availability = 1;
  string inert_reason = 2;
}

// Common typed failure used by application and renderer adapters. Detail is
// inert display text and cannot be interpreted as authority.
message ApplicationContractError {
  ApplicationErrorCode code = 1;
  string inert_detail = 2;
  bool retry_may_be_safe = 3;
  infinium.domain.v1.ProjectionVersion current_projection_version = 4;
  RevisionToken current_revision = 5;
}

enum ApplicationErrorCode {
  APPLICATION_ERROR_CODE_UNSPECIFIED = 0;
  APPLICATION_ERROR_CODE_INVALID_ARGUMENT = 1;
  APPLICATION_ERROR_CODE_UNAUTHENTICATED = 2;
  APPLICATION_ERROR_CODE_UNAUTHORIZED = 3;
  APPLICATION_ERROR_CODE_NOT_FOUND = 4;
  APPLICATION_ERROR_CODE_CONFLICT = 5;
  APPLICATION_ERROR_CODE_INCOMPATIBLE_VERSION = 6;
  APPLICATION_ERROR_CODE_UNSUPPORTED = 7;
  APPLICATION_ERROR_CODE_LIMIT_EXCEEDED = 8;
  APPLICATION_ERROR_CODE_DEADLINE_EXPIRED = 9;
  APPLICATION_ERROR_CODE_STALE_FENCE = 10;
  APPLICATION_ERROR_CODE_RESYNC_REQUIRED = 11;
  APPLICATION_ERROR_CODE_INDETERMINATE = 12;
  APPLICATION_ERROR_CODE_INTERNAL = 13;
  APPLICATION_ERROR_CODE_REPLAYED = 14;
  APPLICATION_ERROR_CODE_OUT_OF_ORDER = 15;
  APPLICATION_ERROR_CODE_UNKNOWN = 16;
  APPLICATION_ERROR_CODE_UNAVAILABLE = 17;
  APPLICATION_ERROR_CODE_CANCELLED = 18;
}

message RevisionToken { string opaque_value = 1; }

message RevisionConflict {
  RevisionToken expected = 1;
  RevisionToken current = 2;
  ConflictDisposition disposition = 3;
}

enum ConflictDisposition {
  CONFLICT_DISPOSITION_UNSPECIFIED = 0;
  CONFLICT_DISPOSITION_STALE_REVISION = 1;
  CONFLICT_DISPOSITION_ALREADY_APPLIED = 2;
  CONFLICT_DISPOSITION_RESYNC_REQUIRED = 3;
  CONFLICT_DISPOSITION_UNKNOWN = 4;
  CONFLICT_DISPOSITION_UNSUPPORTED = 5;
}

message UserOperationReceipt {
  string request_id = 1;
  string receipt_id = 2;
  OperationDisposition disposition = 3;
  RevisionToken accepted_revision = 4;
  RevisionConflict conflict = 5;
  ApplicationContractError error = 6;
  infinium.common.v1.Instant observed_at = 7;
}

enum OperationDisposition {
  OPERATION_DISPOSITION_UNSPECIFIED = 0;
  OPERATION_DISPOSITION_ACCEPTED = 1;
  OPERATION_DISPOSITION_ALREADY_ACCEPTED = 2;
  OPERATION_DISPOSITION_REJECTED = 3;
  OPERATION_DISPOSITION_CONFLICT = 4;
  OPERATION_DISPOSITION_INDETERMINATE = 5;
  OPERATION_DISPOSITION_CANCELLED = 6;
  OPERATION_DISPOSITION_UNKNOWN = 7;
  OPERATION_DISPOSITION_UNSUPPORTED = 8;
  OPERATION_DISPOSITION_UNAVAILABLE = 9;
  OPERATION_DISPOSITION_RESYNC_REQUIRED = 10;
}

message CancellationRequest {
  string request_id = 1;
  string target_request_id = 2;
}

message CancellationReceipt {
  string request_id = 1;
  string target_request_id = 2;
  CancellationDisposition disposition = 3;
  ApplicationContractError error = 4;
}

// The native application client uses this closed setup surface. Tool-specific
// locations never become generic path authority and are not renderer payloads.
message GetSetupStateRequest {
  uint32 maximum_saved_configurations = 1;
  infinium.domain.v1.ProjectionVersion expected_projection_version = 2;

  reserved 90 to 99;
  reserved "generic_path", "sql", "command", "url", "credential", "provider_request";
}

message GetSetupStateResponse {
  oneof result {
    SetupState setup = 1;
    ApplicationContractError error = 2;
  }
}

message SetupState {
  repeated ToolConfiguration tools = 1;
  ProfileSelection profile_selection = 2;
  repeated SavedScanConfiguration saved_configurations = 3;
  ProviderEnrollmentStatus provider = 4;
  infinium.domain.v1.ProjectionVersion projection_version = 5;
  infinium.common.v1.Instant observed_at = 6;
}

enum ExternalToolKind {
  EXTERNAL_TOOL_KIND_UNSPECIFIED = 0;
  EXTERNAL_TOOL_KIND_MOD_ORGANIZER_2 = 1;
  EXTERNAL_TOOL_KIND_LOOT = 2;
  EXTERNAL_TOOL_KIND_UNKNOWN = 3;
  EXTERNAL_TOOL_KIND_UNSUPPORTED = 4;
}

enum ToolValidationState {
  TOOL_VALIDATION_STATE_UNSPECIFIED = 0;
  TOOL_VALIDATION_STATE_AVAILABLE = 1;
  TOOL_VALIDATION_STATE_MISSING = 2;
  TOOL_VALIDATION_STATE_UNSUPPORTED = 3;
  TOOL_VALIDATION_STATE_MISCONFIGURED = 4;
  TOOL_VALIDATION_STATE_NOT_YET_VALIDATED = 5;
  TOOL_VALIDATION_STATE_UNKNOWN = 6;
}

message ToolConfiguration {
  ExternalToolKind tool = 1;
  ToolValidationState state = 2;
  string installation_root = 3;
  string executable_path = 4;
  string observed_version = 5;
  string inert_reason = 6;
  repeated string capability_gaps = 7;
  RevisionToken revision = 8;
  infinium.common.v1.Instant validated_at = 9;
}

message ProfileCandidate {
  string candidate_id = 1;
  string display_name = 2;
  bool saved_selection_suggestion = 3;
}

message ProfileSelection {
  repeated ProfileCandidate candidates = 1;
  string suggested_candidate_id = 2;
  string confirmed_candidate_id = 3;
  bool explicitly_confirmed = 4;
  RevisionToken revision = 5;
  infinium.common.v1.Instant updated_at = 6;
}

message ScanConfigurationValues {
  repeated string analyzer_ids = 1;
  bool local_only = 2;
  uint32 maximum_concurrency = 3;
  uint64 maximum_provider_dispatches = 4;
  uint64 maximum_calculated_nano_usd = 5;
  uint64 maximum_elapsed_milliseconds = 6;
}

message SavedScanConfiguration {
  infinium.domain.v1.ScanConfigurationId configuration_id = 1;
  string name = 2;
  ScanConfigurationValues values = 3;
  RevisionToken revision = 4;
  bool deleted = 5;
  infinium.common.v1.Instant updated_at = 6;
}

message ProviderEnrollmentStatus {
  bool configured = 1;
  bool verified = 2;
  bool enrollment_pending = 3;
  bool secure_store_available = 4;
  string inert_status = 5;
  infinium.domain.v1.ProviderAccessProfileId profile_id = 6;
  RevisionToken revision = 7;
}

message SubmitSetupCommandRequest {
  string request_id = 1;
  RevisionToken expected_revision = 2;
  oneof command {
    ValidateToolConfiguration validate_tool = 10;
    ConfirmProfileSelection confirm_profile = 11;
    CreateSavedScanConfiguration create_configuration = 12;
    CloneSavedScanConfiguration clone_configuration = 13;
    UpdateSavedScanConfiguration update_configuration = 14;
    DeleteSavedScanConfiguration delete_configuration = 15;
    RequestProviderEnrollment request_provider_enrollment = 16;
  }

  reserved 90 to 99;
  reserved "generic_path", "sql", "command_line", "url", "credential", "provider_request";
}

message ValidateToolConfiguration {
  ExternalToolKind tool = 1;
  oneof location {
    string mod_organizer_installation_root = 2;
    string loot_installation_root = 3;
  }
}

message ConfirmProfileSelection { string candidate_id = 1; }

message CreateSavedScanConfiguration {
  infinium.domain.v1.ScanConfigurationId configuration_id = 1;
  string name = 2;
  ScanConfigurationValues values = 3;
}

message CloneSavedScanConfiguration {
  infinium.domain.v1.ScanConfigurationId source_configuration_id = 1;
  infinium.domain.v1.ScanConfigurationId configuration_id = 2;
  string name = 3;
}

message UpdateSavedScanConfiguration {
  infinium.domain.v1.ScanConfigurationId configuration_id = 1;
  string name = 2;
  ScanConfigurationValues values = 3;
}

message DeleteSavedScanConfiguration {
  infinium.domain.v1.ScanConfigurationId configuration_id = 1;
}

message RequestProviderEnrollment {
  infinium.domain.v1.ProviderAccessProfileId profile_id = 1;
  string display_label = 2;
}

message SubmitSetupCommandResponse {
  UserOperationReceipt receipt = 1;
  SetupState setup = 2;
}

message PrepareManualRunRequest {
  string request_id = 1;
  infinium.domain.v1.ScanConfigurationId saved_configuration_id = 2;
  RevisionToken expected_configuration_revision = 3;
  RevisionToken expected_profile_revision = 4;
  infinium.domain.v1.InstallationSnapshotId installation_snapshot_id = 5;
  infinium.domain.v1.AnalysisContextId analysis_context_id = 6;
  infinium.domain.v1.ResolvedInputManifestId resolved_input_manifest_id = 7;

  reserved 90 to 99;
  reserved "analysis_orchestration_request_json", "generic_path", "sql", "command_line", "url", "credential", "provider_request";
}

message PrepareManualRunResponse {
  oneof result {
    PreparedManualRun preparation = 1;
    RevisionConflict conflict = 2;
    ApplicationContractError error = 3;
  }
}

message PreparedManualRun {
  string preparation_id = 1;
  RevisionToken revision = 2;
  string confirmed_profile_id = 3;
  RevisionToken profile_revision = 4;
  infinium.domain.v1.ScanConfigurationId saved_configuration_id = 5;
  RevisionToken saved_configuration_revision = 6;
  infinium.domain.v1.ScanConfigurationId effective_configuration_id = 7;
  infinium.domain.v1.InstallationSnapshotId installation_snapshot_id = 8;
  infinium.domain.v1.AnalysisContextId analysis_context_id = 9;
  infinium.domain.v1.ResolvedInputManifestId resolved_input_manifest_id = 10;
  WorkEstimate estimate = 11;
  repeated string limitations = 12;
  infinium.common.v1.Instant prepared_at = 13;
}

message WorkEstimate {
  infinium.common.v1.OptionalUInt64 planned_work_units = 1;
  infinium.common.v1.OptionalUInt64 estimated_elapsed_milliseconds = 2;
  infinium.common.v1.OptionalInt64 estimated_calculated_nano_usd = 3;
  infinium.common.v1.OptionalUInt64 provider_dispatches = 4;
  string authority_statement = 5;
  infinium.common.v1.OptionalUInt64 estimated_coverage_units = 6;
}

message SubmitPreparedRunRequest {
  infinium.domain.v1.DurableCommandId idempotency_key = 1;
  string preparation_id = 2;
  RevisionToken expected_preparation_revision = 3;
  string user_gesture_id = 4;
  ManualInitiationKind initiation_kind = 5;
  infinium.common.v1.Instant dispatch_deadline = 6;
  infinium.domain.v1.RunId requested_run_id = 7;

  reserved 90 to 99;
  reserved "analysis_orchestration_request_json", "generic_path", "sql", "command_line", "url", "credential", "provider_request";
}

enum CancellationDisposition {
  CANCELLATION_DISPOSITION_UNSPECIFIED = 0;
  CANCELLATION_DISPOSITION_TRANSPORT_ONLY = 1;
  CANCELLATION_DISPOSITION_NOT_FOUND = 2;
  CANCELLATION_DISPOSITION_ALREADY_COMPLETED = 3;
  CANCELLATION_DISPOSITION_REJECTED = 4;
  CANCELLATION_DISPOSITION_UNKNOWN = 5;
  CANCELLATION_DISPOSITION_UNSUPPORTED = 6;
}

message GetProviderProfileRequest {
  infinium.domain.v1.ProviderAccessProfileId profile_id = 1;
  bool include_historical_generations = 2;
}

message GetProviderProfileResponse {
  oneof result { ProviderProfilePayload profile = 1; infinium.common.v1.Failure failure = 2; }
}

message ProviderProfilePayload {
  infinium.domain.v1.ProviderAccessProfileId profile_id = 1;
  infinium.domain.v1.CredentialGenerationId generation_id = 2;
  ProviderProfileLifecycleState lifecycle_state = 3;
  ProviderAvailabilityState verification_state = 4;
  infinium.domain.v1.CapabilitySnapshotId capability_snapshot_id = 5;
  uint64 revocation_epoch = 6;
  repeated string gaps = 7;
  uint64 generation_ordinal = 8;
  infinium.domain.v1.ProviderAccountIdentityId account_identity_id = 9;
  infinium.domain.v1.BillingScopeIdentityId billing_scope_identity_id = 10;
  string intent_id = 11;
  string recovery_disposition = 12;
  string cleanup_disposition = 13;
  string provider = 14;
  string purpose = 15;
  string display_label = 16;
  infinium.common.v1.Instant recorded_at = 17;
}

message GetProviderOperationRequest {
  infinium.domain.v1.OperationId operation_id = 1;
  bool include_usage = 2;
  bool include_settlement = 3;
  bool include_replay = 4;
}

message GetProviderOperationResponse {
  oneof result { ProviderOperationPayload operation = 1; infinium.common.v1.Failure failure = 2; }
}

message ProviderOperationPayload {
  infinium.domain.v1.OperationId operation_id = 1;
  ProviderOperationKind operation_kind = 2;
  ProviderOperationLifecycleState state = 3;
  OptionalProviderQuantity input_tokens = 4;
  OptionalProviderQuantity output_tokens = 5;
  OptionalProviderQuantity calculated_nano_usd = 6;
  ProviderSettlementState settlement_state = 7;
  ProviderReplayState replay_state = 8;
  repeated string gaps = 9;
  infinium.domain.v1.ProviderAccessProfileId profile_id = 10;
  infinium.domain.v1.CredentialGenerationId generation_id = 11;
  uint64 revocation_epoch = 12;
  string owner_kind = 13;
  string owner_id = 14;
  string job_node_id = 15;
  string authorization_id = 16;
  infinium.domain.v1.AttemptId attempt_id = 17;
  string request_id = 18;
  infinium.domain.v1.ReservationGroupId reservation_id = 19;
  infinium.domain.v1.DispatchId dispatch_fence_id = 20;
  string response_record_id = 21;
  string usage_entry_id = 22;
  string settlement_id = 23;
  string replay_edge_id = 24;
  infinium.domain.v1.CapabilitySnapshotId capability_snapshot_id = 25;
  infinium.domain.v1.PriceSnapshotId price_snapshot_id = 26;
  OptionalProviderQuantity dispatch_count = 27;
  OptionalProviderQuantity reasoning_tokens = 28;
  OptionalProviderQuantity cache_read_tokens = 29;
  OptionalProviderQuantity cache_write_tokens = 30;
  OptionalProviderQuantity reserved_nano_usd = 31;
  bool unresolved_hold = 32;
  InputBoundProofStatus input_bound_proof_status = 33;
  string input_bound_policy_id = 34;
  string input_bound_policy_version = 35;
  reserved 36, 37;
  reserved "canonical_request_bytes", "proved_input_token_bound";
  ProviderResponsePayload response = 38;
  OptionalProviderQuantity total_tokens = 39;
  string effective_configuration_v2_id = 40;
  string command_id = 41;
  infinium.common.v1.Instant requested_at = 42;
  string transport_event_id = 43;
  string receipt_id = 44;
  ProviderAccountingVector reserved = 45;
  ProviderAccountingVector observed = 46;
  ProviderAccountingVector released = 47;
  ProviderAccountingVector retained = 48;
  UsageReceiptState usage_receipt_state = 49;
  string transport_state = 50;
  string receipt_state = 51;
}

message ProviderAccountingVector {
  OptionalProviderQuantity dispatch_count = 1;
  OptionalProviderQuantity input_tokens = 2;
  OptionalProviderQuantity output_tokens = 3;
  OptionalProviderQuantity total_tokens = 4;
  OptionalProviderQuantity reasoning_tokens = 5;
  OptionalProviderQuantity cache_read_tokens = 6;
  OptionalProviderQuantity cache_write_tokens = 7;
  OptionalProviderQuantity priced_tool_calls = 8;
  OptionalProviderQuantity calculated_nano_usd = 9;
}

message ProviderResponsePayload {
  string response_record_id = 1;
  string request_id = 2;
  infinium.domain.v1.DispatchId dispatch_fence_id = 3;
  infinium.common.v1.ContentDigest raw_response = 4;
  uint64 maximum_raw_response_bytes = 5;
  infinium.common.v1.ContentDigest response_headers = 6;
  ProviderAvailabilityState response_headers_availability = 7;
  optional uint32 http_status = 8;
  string provider_response_id = 9;
  string provider_request_id = 10;
  ProviderAvailabilityState provider_request_id_availability = 11;
  string response_state = 12;
  string refusal_code = 13;
  string incomplete_reason = 14;
  string error_code = 15;
  string requested_model = 16;
  string returned_model = 17;
  string requested_service_tier = 18;
  string returned_service_tier = 19;
  string reasoning_context = 20;
  string reasoning_mode = 21;
  string prompt_cache_mode = 22;
  OptionalProviderQuantity dispatch_count = 23;
  OptionalProviderQuantity input_tokens = 24;
  OptionalProviderQuantity output_tokens = 25;
  OptionalProviderQuantity total_tokens = 26;
  OptionalProviderQuantity reasoning_tokens = 27;
  OptionalProviderQuantity cache_read_tokens = 28;
  OptionalProviderQuantity cache_write_tokens = 29;
  OptionalProviderQuantity priced_tool_calls = 30;
  OptionalProviderQuantity calculated_nano_usd = 31;
  ProviderAvailabilityState billing_availability = 32;
  ProviderAvailabilityState rate_availability = 33;
  ProviderAvailabilityState credit_availability = 34;
  repeated ProviderRateLimitFact rate_limit_facts = 35;
  string validation_state = 36;
  string admission_state = 37;
  infinium.common.v1.Instant recorded_at = 38;
  ProviderAvailabilityState availability = 39;
  InputBoundProofStatus input_bound_proof_status = 40;
  string input_bound_policy_id = 41;
  string input_bound_policy_version = 42;
  string client_request_id = 43;
  infinium.common.v1.ContentDigest billing_evidence = 44;
  string authorization_id = 45;
  ProviderOperationKind operation_kind = 46;
  ProviderOperationLimits limits = 47;
  ProviderAvailabilityState raw_response_availability = 48;
  ProviderAvailabilityState http_status_availability = 49;
  ProviderAvailabilityState provider_response_id_availability = 50;
  ProviderAvailabilityState client_request_id_availability = 51;
  ProviderAvailabilityState refusal_availability = 52;
  ProviderAvailabilityState incomplete_availability = 53;
  ProviderAvailabilityState error_availability = 54;
  ProviderAvailabilityState returned_model_availability = 55;
  ProviderAvailabilityState returned_service_tier_availability = 56;
  ProviderAvailabilityState billing_evidence_availability = 57;
  ProviderAvailabilityState usage_availability = 58;
  optional uint64 overflow_observed_excess_bytes = 59;
  string owner_kind = 60;
  string owner_id = 61;
  UsageReceiptState usage_receipt_state = 62;
  infinium.domain.v1.AttemptId attempt_id = 63;
  infinium.domain.v1.ReservationGroupId reservation_id = 64;
}

message ProviderRateLimitFact {
  string scope = 1;
  string dimension = 2;
  ProviderAvailabilityState availability = 3;
  optional uint64 limit = 4;
  optional uint64 remaining = 5;
  infinium.common.v1.Instant observed_at = 6;
  infinium.common.v1.Instant resets_at = 7;
}

message OptionalProviderQuantity { ProviderAvailabilityState availability = 1; optional uint64 value = 2; }

message ListProviderBudgetRequest {
  string scope_kind = 1;
  string scope_id = 2;
  uint32 requested_page_size = 3;
  PageCursor after = 4;
}

message ListProviderBudgetResponse {
  oneof result {
    ProviderBudgetPage page = 1;
    infinium.common.v1.Failure failure = 2;
  }
}

message ProviderBudgetPage {
  repeated ProviderBudgetPayload items = 1;
  PageCursor next = 2;
}

message ProviderBudgetPayload {
  string scope_kind = 1;
  string scope_id = 2;
  uint64 reserved_nano_usd = 3;
  uint64 settled_nano_usd = 4;
  uint64 unresolved_nano_usd = 5;
}

message GetProviderReplayRequest {
  infinium.domain.v1.OperationId operation_id = 1;
  string retained_response_id = 2;
}

message GetProviderReplayResponse {
  oneof result { ProviderReplayPayload replay = 1; infinium.common.v1.Failure failure = 2; }
}

message ProviderReplayPayload {
  infinium.domain.v1.OperationId operation_id = 1;
  string retained_response_id = 2;
  ProviderReplayState replay_state = 3;
  string dependency_manifest_id = 4;
  bool network_permitted = 5;
  string installation_snapshot_id = 6;
  string analysis_context_id = 7;
  string effective_configuration_id = 8;
  string resolved_input_manifest_id = 9;
  string prompt_id = 10;
  bytes prompt_fingerprint_sha256 = 11;
  string output_schema_id = 12;
  bytes output_schema_fingerprint_sha256 = 13;
  bytes canonical_request_bytes = 14;
  bytes canonical_request_fingerprint_sha256 = 15;
  bytes settings_fingerprint_sha256 = 16;
  infinium.domain.v1.ProviderAccessProfileId profile_id = 17;
  infinium.domain.v1.CredentialGenerationId generation_id = 18;
  uint64 revocation_epoch = 19;
  infinium.domain.v1.CapabilitySnapshotId capability_snapshot_id = 20;
  infinium.domain.v1.PriceSnapshotId price_snapshot_id = 21;
  ProviderOperationLimits limits = 22;
  infinium.common.v1.Instant dispatch_deadline = 23;
  string authorization_id = 24;
  infinium.domain.v1.AttemptId attempt_id = 25;
  string request_id = 26;
  infinium.domain.v1.ReservationGroupId reservation_id = 27;
  infinium.domain.v1.DispatchId dispatch_fence_id = 28;
  string usage_entry_id = 29;
  string settlement_id = 30;
  string replay_edge_id = 31;
  int64 retained_hold_nano_usd = 32;
  ProviderOperationKind operation_kind = 33;
  InputBoundProofStatus input_bound_proof_status = 34;
  string input_bound_policy_id = 35;
  string input_bound_policy_version = 36;
}

message SubmitProviderEnrollmentRequest {
  infinium.domain.v1.ProviderAccessProfileId profile_id = 1;
  infinium.domain.v1.CredentialGenerationId generation_id = 2;
