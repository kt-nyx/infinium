appId: com.infinium.app
productName: Infinium
directories:
  output: release
  buildResources: resources
files:
  - dist/main/**
  - dist/renderer/**
  - package.json
  - node_modules/**
win:
  target:
    - nsis
extraResources:
  - from: resources/loot
    to: loot
    filter:
      - "**/*"
  - from: resources/loot-helper
    to: loot-helper
    filter:
      - "**/*"
# TODO: configure code signing and ensure libloot/loot-helper payloads are bundled correctly.






